<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result · GHSQUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-nav">
  <a class="logo" href="/"><span class="logo-mark">GHS</span>QUI</a>
  <nav class="nav-links">
    <a href="/">Quizzes</a>
    <a href="/leaderboards.html">Leaderboards</a>
    <a href="/history.html">My History</a>
  </nav>
  <div class="nav-right">
    <span id="nav-user" class="nav-user"></span>
    <a id="nav-auth" class="nav-auth" href="/login.html">LOG IN</a>
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">&#9789;</button>
  </div>
</header>
<main class="page">

<div class="card result-header" id="result-card" hidden>
  <span class="highscore" id="banner" hidden></span>
  <h2 id="result-title">Result</h2>
  <p class="result-score pixel" id="result-score"></p>
  <p class="result-pct" id="result-pct"></p>
</div>

<div id="review-wrap" hidden>
  <h1>ANSWER REVIEW</h1>
  <div id="review-list"></div>
</div>

<div class="quiz-actions" id="result-actions" hidden>
  <a class="btn" id="btn-retry" href="">&#8635; RETRY QUIZ</a>
  <a class="btn btn-secondary" href="/history.html">MY HISTORY</a>
  <a class="btn btn-secondary" href="/">ALL QUIZZES</a>
</div>

<div class="card login-nudge" id="login-nudge" hidden>
  <h2>LOG IN TO VIEW</h2>
  <p>You need to be logged in to see your results.</p>
  <a class="btn" id="login-nudge-link" href="/login.html">LOG IN</a>
</div>

<div class="card" id="flow-error" hidden>
  <h2>HMM...</h2>
  <p id="flow-error-text"></p>
  <p><a class="btn btn-secondary" href="/">&#9664; BACK TO QUIZZES</a></p>
</div>

</main>
<footer class="site-footer">GHSQUI · a high school project · <a href="https://github.com/bribrielleelle/quiz2">GitHub</a></footer>
<script src="/js/app.js"></script>
<script src="/js/review.js"></script>
</body>
</html>
