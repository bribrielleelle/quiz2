<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up · GHSQUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-nav">
  <a class="logo" href="/"><span class="logo-mark">GHS</span>QUI</a>
  <nav class="nav-links">
    <a href="/">Quizzes</a>
    <a href="/leaderboards.html">Leaderboards</a>
    <a href="/history.html">My History</a>
  </nav>
  <div class="nav-right">
    <span id="nav-user" class="nav-user"></span>
    <a id="nav-auth" class="nav-auth" href="/login.html">LOG IN</a>
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">&#9789;</button>
  </div>
</header>
<main class="page">
<div class="card" style="max-width:480px;margin:2rem auto;">
  <h2>NEW PLAYER</h2>
  <form id="register-form">
    <label for="username">Username</label>
    <input id="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_-]+" title="3-30 letters, numbers, _ or -">
    <label for="email">Email</label>
    <input id="email" type="email" required>
    <label for="password">Password (8+ characters)</label>
    <input id="password" type="password" minlength="8" required>
    <label for="invite_code">Teacher invite code (optional)</label>
    <input id="invite_code" autocomplete="off">
    <p class="form-error" id="form-error"></p>
    <button class="btn" type="submit">CREATE ACCOUNT</button>
  </form>
  <p style="margin-top:1rem;">Already have an account? <a href="/login.html">Log in</a></p>
</div>
</main>
<footer class="site-footer">GHSQUI · a high school project · <a href="https://github.com/bribrielleelle/quiz2">GitHub</a></footer>
<script src="/js/app.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const errEl = document.getElementById('form-error');
  errEl.textContent = '';
  try {
    await getJSON('/api/auth/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        invite_code: document.getElementById('invite_code').value,
      }),
    });
    window.location.href = '/';
  } catch (e) { errEl.textContent = e.message; }
});</script>
</body>
</html>
