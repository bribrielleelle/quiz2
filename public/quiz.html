<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take quiz · GHSQUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-nav">
  <a class="logo" href="/"><span class="logo-mark">GHS</span>QUI</a>
  <nav class="nav-links">
    <a href="/">Quizzes</a>
    <a href="/leaderboards.html">Leaderboards</a>
    <a href="/history.html">My History</a>
  </nav>
  <div class="nav-right">
    <span id="nav-user" class="nav-user"></span>
    <a id="nav-auth" class="nav-auth" href="/login.html">LOG IN</a>
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">&#9789;</button>
  </div>
</header>
<main class="page">
<div class="card">
  <h2 id="quiz-title">Quiz</h2>
  <p id="quiz-note" class="badge-muted">The quiz-taking flow (question screens, timer, submission, results) is built in Phase 3.</p>
</div>
</main>
<footer class="site-footer">GHSQUI · a high school project · <a href="https://github.com/bribrielleelle/quiz2">GitHub</a></footer>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const id = new URLSearchParams(window.location.search).get('id');
  try {
    const { quiz } = await getJSON('/api/quizzes/' + id);
    document.getElementById('quiz-title').textContent = quiz.title;
  } catch (e) {
    document.getElementById('quiz-title').textContent = 'Quiz not found';
    document.getElementById('quiz-note').textContent = e.message;
  }
});</script>
</body>
</html>
