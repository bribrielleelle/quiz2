<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboards · GHSQUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-nav">
  <a class="logo" href="/"><span class="logo-mark">GHS</span>QUI</a>
  <nav class="nav-links">
    <a href="/">Quizzes</a>
    <a href="/leaderboards.html">Leaderboards</a>
    <a href="/history.html">My History</a>
  </nav>
  <div class="nav-right">
    <span id="nav-user" class="nav-user"></span>
    <a id="nav-auth" class="nav-auth" href="/login.html">LOG IN</a>
    <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">&#9789;</button>
  </div>
</header>
<main class="page">
<h1>LEADERBOARDS</h1>
<div class="card">
  <div class="tab-row">
    <button class="btn" id="tab-overall">OVERALL</button>
    <select id="quiz-select" style="max-width:280px;"><option value="">Choose a quiz…</option></select>
  </div>
  <table id="lb-table"><thead><tr><th>RANK</th><th>PLAYER</th><th id="lb-metric-head">COMPLETED ATTEMPTS</th></tr></thead><tbody></tbody></table>
  <p id="lb-empty" class="badge-muted"></p>
</div>
</main>
<footer class="site-footer">GHSQUI · a high school project · <a href="https://github.com/bribrielleelle/quiz2">GitHub</a></footer>
<script src="/js/app.js"></script>
<script>
async function loadOverall() {
  document.getElementById('lb-metric-head').textContent = 'COMPLETED ATTEMPTS';
  try {
    const { leaderboard } = await getJSON('/api/leaderboards');
    renderRows(leaderboard.map((r) => [r.username, r.completed_attempts]));
  } catch (e) { renderRows([]); }
}
function renderRows(rows) {
  const body = document.querySelector('#lb-table tbody');
  const empty = document.getElementById('lb-empty');
  body.innerHTML = rows.map((r, i) =>
    '<tr' + (i === 0 ? ' class="rank-1"' : '') + '><td>' + (i + 1) + '</td><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'
  ).join('');
  empty.textContent = rows.length ? '' : 'No completed attempts yet — be the first!';
}
async function loadQuizPicker() {
  try {
    const { quizzes } = await getJSON('/api/quizzes');
    const sel = document.getElementById('quiz-select');
    sel.innerHTML = '<option value="">Choose a quiz…</option>' + quizzes.map((q) => '<option value="' + q.id + '">' + q.title + '</option>').join('');
  } catch (e) { /* ignore */ }
}
async function loadQuizBoard(quizId) {
  if (!quizId) { loadOverall(); return; }
  document.getElementById('lb-metric-head').textContent = 'BEST SCORE';
  try {
    const { leaderboard } = await getJSON('/api/quizzes/' + quizId + '/leaderboard');
    renderRows(leaderboard.map((r) => [r.username, r.best_score + ' / ' + r.question_count + ' (' + r.completed_attempts + ' tries)']));
  } catch (e) { renderRows([]); }
}
document.addEventListener('DOMContentLoaded', () => { loadOverall(); loadQuizPicker(); });
document.getElementById('tab-overall').addEventListener('click', () => { document.getElementById('quiz-select').value = ''; loadOverall(); });
document.getElementById('quiz-select').addEventListener('change', (e) => loadQuizBoard(e.target.value));</script>
</body>
</html>
